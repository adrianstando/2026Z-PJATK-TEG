# Neo4j do zajęć 4: docker compose up -d (w folderze 04-graphrag)
# Przeglądarka: http://localhost:7474, logowanie neo4j / password123
services:
  neo4j:
    image: neo4j:2026.09-community
    container_name: teg-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # protokół Bolt (sterownik Pythona)
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:

# Buduje web/ (statyczny eksport Next.js) i publikuje na GitHub Pages.
# Przed buildem `prebuild` wyciąga komórki web:* z notebooków, więc zmiana
# w notebooku sama trafia na stronę po pushu do main.
#
# Jednorazowo: Settings → Pages → Source: GitHub Actions.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "**/*.ipynb", "00-dostep-do-llm/README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
